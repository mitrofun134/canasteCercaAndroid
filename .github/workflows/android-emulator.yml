# T7: оболочка и сайт внутри неё — на эмуляторе Android при каждом пуше и в каждом PR, без Mac и без ручного запуска.
# Сайт — демо-сервер из mitrofun134/canasteCercaWeb (секрет WEB_REPO_TOKEN: только чтение этого репозитория, H51).
# Репозиторий публичный, логи видны всем: ключ прода здесь не нужен (демо без ключа), токен в лог не печатаем.
name: Android — эмулятор
# Действия — версии на Node.js 24 (Node.js 20 в Actions устарел): checkout/setup-java/setup-node v5, setup-python v6,
# upload-artifact v6, download-artifact v7, setup-gradle v5

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      break_check:
        description: "Приёмка T7: намеренно сломанная проверка — прогон должен стать красным"
        type: boolean
        default: false

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Сборка debug и теста
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: assembleDebug, assembleDebugAndroidTest
        # Сборка упала — ошибки Kotlin, ресурсов и Gradle одной аннотацией: её видно на странице прогона без входа в
        # GitHub (логи — только со входом). Иначе там только «Process completed with exit code 1»
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug assembleDebugAndroidTest --console=plain 2>&1 | tee build.log; then
            msg=$(awk '/^e: |ERROR|error:|^FAILURE/{print; next} /What went wrong/{w=8} w>0{print; w--}' build.log |
              sed "s#file://$GITHUB_WORKSPACE/##g; s#$GITHUB_WORKSPACE/##g" | grep -v '^\s*$' | head -n 40 | cut -c1-300 |
              sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/::/: /g')
            echo "::error title=Сборка debug и теста::${msg:-причина не найдена — см. лог шага}"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: apk-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  bridge:
    name: Мост в Chromium (tools/bridge_test.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mitrofun134/canasteCercaWeb
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Playwright и Chromium
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Демо-сервер сайта
        run: bash tools/ci/demo-server.sh web 3077
      - name: bridge_test.py
        # localhost, а не 127.0.0.1: тест не пускает страницу ни на какие адреса, кроме localhost
        run: mkdir -p ci-out/bridge && SHOTS=ci-out/bridge python tools/bridge_test.py app/src/main/kotlin/ar/canastacerca/MainActivity.kt http://localhost:3077
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bridge
          path: ci-out
          retention-days: 14

  emulator:
    name: Эмулятор ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Экран 1080 × 2400 (pixel_6): плотность 480 — 360 × 800 dp, 420 — 412 × 915 dp
          # gpu: на Android 14 карта сайта (WebGL) под swiftshader роняла эмулятор целиком — там swangle (ANGLE + SwiftShader)
          # Android 10: WebView образа — 74, ниже минимума 105 (ГД 25.11) — здесь проверяется экран «Actualizá Android
          # System WebView» (t09), сайт не открывается. Сайт на 360 dp — на Android 14 (t08 меняет плотность, DesignTest)
          - { name: "Android 10, старый WebView", api: 29, density: 480, slug: android10-360, gpu: swiftshader_indirect }
          - { name: "Android 14, 412 dp", api: 34, density: 420, slug: android14-412, gpu: swangle_indirect }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mitrofun134/canasteCercaWeb
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: apk-debug
          path: apk
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Демо-сервер сайта (эмулятор видит его как 10.0.2.2:3000)
        run: bash tools/ci/demo-server.sh web 3000
      - name: Эмулятор, тест оболочки, смоук QA
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC_NAME: ${{ matrix.name }}
          CC_OUT: ${{ github.workspace }}/ci-out
          CC_APK_DIR: ${{ github.workspace }}/apk
          CC_WEB: ${{ github.workspace }}/web
          CC_DENSITY: ${{ matrix.density }}
          CC_BREAK: ${{ inputs.break_check }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # Android 14 с сервисами Google на 2 ГБ и 2 ядрах подтормаживает до окон «isn't responding»
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/ci/emulator-run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-${{ matrix.slug }}
          path: ci-out
          retention-days: 14
      # Для дизайнера отдельно (D96): снимки и замер на 412 и 360 dp, index.html; на Mac — tools/ci/design-pull.command
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: design-${{ matrix.slug }}
          path: ci-out/design
          retention-days: 30
          if-no-files-found: ignore

  # Тест-кейсы QA P0/P1 (qa/TEST-CASES.md сайта, ГД 25.11). Пока QA не отобрал, какие кейсы имеют смысл в приложении
  # (Q124), эти два задания показывают итог, но не делают прогон красным (continue-on-error).
  qa-api:
    name: QA P0/P1 — API и данные
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mitrofun134/canasteCercaWeb
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: qa/api и qa/data — кейсы P0/P1
        env:
          CC_OUT: ${{ github.workspace }}/ci-out
        run: bash tools/ci/qa/api.sh web
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qa-api
          path: ci-out
          retention-days: 14

  qa-app:
    name: QA P0/P1 в приложении — Android 14, 412 dp
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mitrofun134/canasteCercaWeb
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: apk-debug
          path: apk
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Адрес 10.0.2.2 и на машине CI — один адрес сервера для приложения и для тестов
        run: sudo ip addr add 10.0.2.2/32 dev lo
      - name: Демо-сервер сайта на 0.0.0.0:3000
        env:
          CC_HOST: 0.0.0.0
        run: bash tools/ci/demo-server.sh web 3000
      - name: Эмулятор и кейсы QA UI/e2e внутри приложения
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC_NAME: QA в приложении, Android 14
          CC_OUT: ${{ github.workspace }}/ci-out
          CC_APK_DIR: ${{ github.workspace }}/apk
          CC_WEB: ${{ github.workspace }}/web
          CC_DENSITY: 420
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # Android 14 с сервисами Google на 2 ГБ и 2 ядрах подтормаживает до окон «isn't responding»
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -timezone America/Argentina/Buenos_Aires
          script: bash tools/ci/qa/in-app.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qa-app-android14
          path: ci-out
          retention-days: 14
