org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Адрес сервера Canasta Cerca (npm run dev в папке canasta-cerca).
# Эмулятор видит localhost компьютера как 10.0.2.2.
# Телефон в той же Wi-Fi: HOST=0.0.0.0 npm start и сюда http://<IP компьютера>:3000/
canasta.baseUrl=http://10.0.2.2:3000/
# Ключ доступа (k=… из npm run share) сюда НЕ писать: репозиторий публичный.
# Ключ и свой адрес сервера — в ~/.gradle/gradle.properties (он важнее этого файла и не попадает в git):
#   canasta.baseUrl=https://…trycloudflare.com/
#   canasta.accessKey=…
