org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Адрес сайта и ключ доступа здесь НЕ задаём: репозиторий публичный.
# По умолчанию debug открывает http://10.0.2.2:3000/ (npm run dev на этом Mac), release — https://canastacerca.com/.
# Своё — в ~/.gradle/gradle.properties (он важнее этого файла и не попадает в git), например:
#   canasta.accessKey=…                              ключ закрытого сайта (из ссылки ?k=…)
#   canasta.baseUrl=https://….trycloudflare.com/     другой сервер для обеих сборок
#   canasta.upload.storeFile=/Users/…/canasta-upload.jks   ключ загрузки в Google Play (README)
