[versions]
# Версии, которые уже скачаны на Mac разработчика (~/.gradle/caches): сборка идёт без сюрпризов
agp = "9.2.1"

compileSdk = "36"
targetSdk = "36"
minSdk = "26"

activity = "1.11.0"
coreKtx = "1.17.0"
webkit = "1.15.0"
# «Потянуть — обновить» (T3); новая — Gradle скачает при первой сборке
swiperefreshlayout = "1.1.0"
# Crashlytics — только когда есть app/google-services.json (app/build.gradle.kts); BoM 35.1.0 — 21.10.2026
firebaseBom = "35.1.0"
# Firebase (через Google Play services) тянет androidx.fragment 1.0 — lint запрещает его рядом с registerForActivityResult
fragment = "1.8.5"
# Тест оболочки на эмуляторе (T7, app/src/androidTest): только для CI и ручного запуска, в приложение не попадает
androidxTestRunner = "1.6.2"
uiautomator = "2.3.0"
junit = "4.13.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
